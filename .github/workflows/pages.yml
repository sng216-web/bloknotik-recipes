name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sng216-web.github.io/bloknotik-recipes/' }}
      - run: npx playwright install --with-deps chromium
      # Browser checks use the default project base path; custom-domain builds are
      # checked by the static artifact validator and the normal CI build.
      - run: npm run test:browser
        if: vars.SITE_URL == '' || vars.SITE_URL == 'https://sng216-web.github.io/bloknotik-recipes/'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
